[project]
name = "soundboard"
version = "0.1.0"
description = "Local Discord soundboard with dual audio output and global hotkeys"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7.0",
    "sounddevice>=0.5.1",
    "miniaudio>=1.61",
    "numpy>=2.0.0",
    "keyboard>=0.13.5",
]

[project.scripts]
soundboard = "soundboard.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundboard"]
