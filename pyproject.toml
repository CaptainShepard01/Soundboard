[project]
name = "soundboard"
version = "1.2.2"
description = "Local Discord soundboard with dual audio output and global hotkeys"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Anton Balykov" }]
keywords = ["soundboard", "discord", "audio", "hotkeys", "windows"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PyQt6>=6.7.0",
    "sounddevice>=0.5.1",
    "miniaudio>=1.61",
    "numpy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/CaptainShepard01/Soundboard"
Repository = "https://github.com/CaptainShepard01/Soundboard"
Issues = "https://github.com/CaptainShepard01/Soundboard/issues"

[project.scripts]
soundboard = "soundboard.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundboard"]
