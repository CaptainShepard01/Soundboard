name: Release

# Triggers when you push a version tag like v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # needed to create the GitHub release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Use pip directly so PyInstaller uses the system Python and its DLLs,
      # avoiding the DLL path issues that occur with uv's managed Python.
      - name: Install dependencies and build tools
        run: pip install PyQt6>=6.7.0 sounddevice>=0.5.1 miniaudio>=1.61 "numpy>=2.0.0" "keyboard>=0.13.5" pyinstaller pillow

      - name: Build Soundboard.exe
        run: >
          pyinstaller
          --onefile
          --windowed
          --name Soundboard
          --icon assets/icon.png
          --add-data "assets/icon.png;assets"
          soundboard/main.py

      - name: Create GitHub Release and upload exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Soundboard.exe
          generate_release_notes: true
